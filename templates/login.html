<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DevHub - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .auth-card h1 {
            margin-bottom: 10px;
            text-align: center;
        }

        .auth-card p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>

    <header class="navbar">

        <div class="logo">
            DevHub 🚀
        </div>

        <nav>

            <a href="/">
                Dashboard
            </a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>
                Welcome Back 👋
            </h1>

            <p>
                Login to your DevHub account.
            </p>


            <form method="POST">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </main>

</body>

</html>
