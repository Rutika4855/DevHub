<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Project - DevHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            DevHub 🚀
        </div>

        <nav>
            <a href="/">Home</a>
            |
            <a href="/projects">Projects</a>
        </nav>

    </header>


    <main class="container">

        <section class="tool-card">

            <h1>Edit Project ✏️</h1>

            <br>

            <form method="POST">

                <label>Project Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ project['name'] }}"
                    required
                >

                <br><br>


                <label>Description</label>

                <textarea
                    name="description"
                    rows="4"
                >{{ project['description'] }}</textarea>

                <br><br>


                <label>Technology</label>

                <input
                    type="text"
                    name="technology"
                    value="{{ project['technology'] }}"
                >

                <br><br>


                <button type="submit">
                    💾 Save Changes
                </button>

            </form>

        </section>

    </main>

</body>

</html>
